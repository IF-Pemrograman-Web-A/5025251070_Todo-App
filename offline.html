<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header-container" role="banner">
        <h1>To Do List</h1>
    </header>

    <div class="layout-wrapper" style="grid-template-columns: 1fr; max-width: 600px; margin: 60px auto;">
        <div class="empty-state" style="padding: 40px 20px;">
            <h2 style="color: #1b4332; margin-bottom: 20px;">You are currently offline</h2>
            <button onclick="window.location.reload()" class="subut" style="max-width: 200px; margin: 0 auto; display: inline-block;">Retry</button>
        </div>
    </div>

    <footer class="app-footer" role="contentinfo">
        <p>&copy; 2026 Pandutama; Tugas Pemrograman Web</p>
    </footer>
</body>
</html>
