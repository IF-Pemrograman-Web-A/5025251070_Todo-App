<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="darkreader-lock">
  <meta name="color-scheme" content="light">
  <title>To Do List</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <a href="#main-content" class="skip-link">Lewati ke konten utama</a>

  <header class="header-container" role="banner">
    <h1>To Do List</h1>
    <button type="button" id="toggle-theme" class="btn-theme" aria-label="Ganti mode tampilan gelap atau terang">Dark Mode</button>
  </header>

  <div class="layout">
    <aside class="tab-todo" role="region" aria-labelledby="form-heading">
      <h2 id="form-heading">Add a New Task</h2>

      <form class="todo-form" aria-label="Formulir tambah tugas">
        <div class="form">
          <label for="nama">Title <span aria-hidden="true">*</span></label>
          <input type="text" id="nama" name="title" required aria-required="true" placeholder="Nama tugas...">
        </div>

        <div class="form">
          <label for="desc">Description <span aria-hidden="true">*</span></label>
          <input type="text" id="desc" name="description" required aria-required="true" placeholder="Deskripsi tugas...">
        </div>

        <div class="form">
          <label for="dl">Deadline <span aria-hidden="true">*</span></label>
          <input type="date" id="dl" name="deadline" required aria-required="true">
        </div>

        <div class="form">
          <label for="notif-time">Notification Time</label>
          <input type="time" id="notif-time" name="notifTime" aria-describedby="notif-desc">
          <small id="notif-desc" class="form-hint">Pilih jam untuk pengingat tugas hari ini</small>
        </div>

        <div class="form">
          <label for="foto">Image</label>
          <input type="file" id="foto" name="image" accept="image/*" capture="environment" aria-describedby="foto-desc">
          <small id="foto-desc" class="form-hint">Upload file foto tugas</small>

          <div id="preview-container" style="display:none;">
            <img id="img-preview" src="" alt="Pratinjau foto yang dipilih">
            <button type="button" id="btn-hapus-foto" class="btn-small btn-danger" aria-label="Hapus foto terpilih">Hapus Foto</button>
          </div>
        </div>

        <button type="submit" class="subut" aria-label="Tambahkan tugas baru">Add Task</button>
      </form>
    </aside>

    <main id="main-content" class="mainscrn" role="main" aria-labelledby="tasks-heading">
      <h2 id="tasks-heading">Your Tasks</h2>
      <div id="todo-list" role="feed" aria-label="Daftar tugas Anda"></div>
      <div id="aria-status" role="status" aria-live="polite" class="sr-only"></div>
    </main>
  </div>

  <footer class="app-footer" role="contentinfo">
    <p>&copy; 2026 Pandutama; Tugas Pemrograman Web</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
